[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-adaptive-scheduler"
version = "0.1.0"
description = "Entropy-Adaptive Background Job Scheduler Experiment"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.2",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
]
